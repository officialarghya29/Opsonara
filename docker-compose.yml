services:
  opsonara:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPSONARA_SEED_DEMO_DATA: "true"
      OPSONARA_LOG_LEVEL: INFO
      OPSONARA_STORE_BACKEND: sqlite
      OPSONARA_DB_PATH: /data/opsonara.db
    volumes:
      - opsonara-data:/data
    restart: unless-stopped

volumes:
  opsonara-data:
