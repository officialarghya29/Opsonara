name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC (Followup B canary)
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Typecheck (mypy)
        working-directory: backend
        run: mypy opsonara

      - name: Tests (pytest)
        working-directory: backend
        run: pytest -v --tb=short

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsonara
          POSTGRES_PASSWORD: opsonara
          POSTGRES_DB: opsonara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsonara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pg8000

      - name: Postgres store integration tests
        working-directory: backend
        env:
          OPSONARA_TEST_PG_DSN: postgresql://opsonara:opsonara@localhost:5432/opsonara
        run: pytest tests/test_pg_store.py -v --tb=short

  recalibration-canary:
    # Weekly canary: runs the recalibration job end-to-end against a real
    # Postgres so the learning-loop CLI can never rot silently (Followup B).
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opsonara
          POSTGRES_PASSWORD: opsonara
          POSTGRES_DB: opsonara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsonara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pg8000

      - name: Recalibration canary (seed, promote, verify idempotency)
        working-directory: backend
        run: |
          python - <<'PY'
          from opsonara.learning import OutcomeStore
          from opsonara.recalibrate_job import main

          # synthetic month: brand_a mostly approvals on high-risk signals
          # (weights should drift DOWN), brand_b mostly rejections.
          store = OutcomeStore()
          signals = {"value_size": "0.6", "injection": "0.7", "customer_history": "0.2",
                     "behavioral": "0.3", "action_sensitivity": "0.4"}
          for i in range(40):
              store.record(audit_id=f"aud_a_{i}", brand_id="brand_a", review_id=None,
                           approved=(i % 5 != 0), risk_score="0.5", signals=signals)
              store.record(audit_id=f"aud_b_{i}", brand_id="brand_b", review_id=None,
                           approved=(i % 2 == 0), risk_score="0.5", signals=signals)

          # 1. first run promotes both brands (audit append path exercised)
          rc1 = main(["--min-outcomes", "10"])
          assert rc1 == 0, f"first recalibration run failed: rc={rc1}"

          # 2. second run must be an idempotent no-op (no double-applied drift)
          rc2 = main(["--min-outcomes", "10"])
          assert rc2 == 0, f"idempotency run failed: rc={rc2}"

          # 3. weights actually moved and are bounded
          from opsonara.learning import clamp_weights
          ws = store.weights_for("brand_a")
          assert ws.version >= 2, f"expected promoted weights, got v{ws.version}"
          assert clamp_weights(ws.weights) == ws.weights, "weights escaped clamp"
          print(f"canary OK: brand_a weights now v{ws.version}: {dict(ws.weights)}")
          PY

      - name: Recalibration canary (all brands)
        working-directory: backend
        env:
          OPSONARA_TEST_PG_DSN: postgresql://opsonara:opsonara@localhost:5432/opsonara
        run: python -m opsonara.recalibrate_job --min-outcomes 10

      - name: Recalibration canary (idempotency check)
        working-directory: backend
        env:
          OPSONARA_TEST_PG_DSN: postgresql://opsonara:opsonara@localhost:5432/opsonara
        run: python -m opsonara.recalibrate_job --min-outcomes 10
